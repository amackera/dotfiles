# Use C-a as prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on

# Smoother scrolling - 1 line at a time instead of 5
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Start windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Better colors
set -g default-terminal "screen-256color"

# Faster escape time (helps with vim/neovim)
set -g escape-time 10

# Increase scrollback history
set -g history-limit 10000

# Easier splits (keep current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows keep current directory
bind c new-window -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Create new session with prefix + N
bind N command-prompt -p "New session name:" "new-session -s '%%'"

# Move current window to another session with prefix + M
bind M command-prompt -p "Move window to session:" "move-window -t '%%:'"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Equalize panes
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Reorder windows with < and >
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# Extended keys for Ghostty (Option as Meta)
set -g extended-keys on
set -sa terminal-features ',xterm-ghostty:extkeys'

# ─── Statusbar ────────────────────────────────────────────────────

# Enable true color support
set -ga terminal-overrides ",*256col*:Tc"

# Status bar position and refresh
set -g status-position bottom
set -g status-interval 5

# Colors (subtle grays with blue accent)
set -g status-style 'bg=#1a1a1a fg=#808080'

# Left: session name
set -g status-left-length 30
set -g status-left '#[fg=#7aa2f7,bold]  #S #[fg=#3a3a3a]│'

# Right: time and date
set -g status-right-length 50
set -g status-right '#[fg=#808080]%H:%M #[fg=#3a3a3a]│ #[fg=#808080]%b %d '

# Window list styling
set -g window-status-format ' #[fg=#606060]#I:#W '
set -g window-status-current-format ' #[fg=#c0c0c0,bold]#I:#W '
set -g window-status-separator ''

# Activity indicator
set -g window-status-activity-style 'fg=#7aa2f7'
set -g monitor-activity on
set -g visual-activity off

# Pane borders (active pane stands out)
set -g pane-border-style 'fg=#3a3a3a'
set -g pane-active-border-style 'fg=#7aa2f7,bold'

# Message styling
set -g message-style 'bg=#1a1a1a fg=#c0c0c0'

# Enable CSI u extended keys format
set -g extended-keys-format csi-u
